<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 1: Nhúng CSS bằng Inline Style</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;">
    
    <div style="background-color: #ffffff; padding: 36px 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04); max-width: 600px; width: 100%; border: 1px solid #e2e8f0;">
        <!-- Tiêu đề sử dụng Inline-style: thay đổi màu chữ sang xanh hoàng gia (#1D4ED8) -->
        <h1 style="color: #1D4ED8; font-size: 28px; margin-top: 0; margin-bottom: 16px; line-height: 1.3;">
            Tiêu Đề Trang Web (Inline Style)
        </h1>

        <!-- Đoạn văn sử dụng Inline-style: thay đổi màu chữ sang xanh lam đậm (#0369A1) và kích thước chữ -->
        <p style="color: #0369A1; font-size: 16px; line-height: 1.7; margin-bottom: 24px;">
            Đây là đoạn văn bản được định dạng màu sắc trực tiếp thông qua thuộc tính <code>style</code> đặt ngay bên trong thẻ mở HTML. Cách nhúng này có độ ưu tiên cao nhất nhưng khó tái sử dụng khi website phát triển lớn.
        </p>

        <div style="background-color: #EFF6FF; border-left: 4px solid #3B82F6; padding: 12px 16px; border-radius: 6px;">
            <p style="margin: 0; color: #1E40AF; font-size: 14px; font-weight: 500;">
                📌 <strong>Ghi chú cú pháp:</strong> <code>&lt;h1 style="color: #1D4ED8;"&gt;...&lt;/h1&gt;</code>
            </p>
        </div>
    </div>

</body>
</html>
